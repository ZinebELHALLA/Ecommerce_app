<div class="max-w-4xl mx-auto">
  <div class="card-premium p-8 border border-gray-100">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">Add New Product</h2>
      <p class="text-gray-500 mt-2">Expand your cute collection with new items!</p>
    </div>

    <div *ngIf="successMessage" class="bg-green-50 text-green-700 p-4 rounded-xl border border-green-200 mb-6 flex items-center justify-center gap-2 animate-pulse">
        <i class="bi bi-check-circle-fill"></i> {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 mb-6 flex items-center justify-center gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i> {{ errorMessage }}
    </div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- Name & SKU -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="form-floating-custom">
            <input type="text" id="name" placeholder="Product Name" formControlName="name">
            <label for="name">Product Name</label>
        </div>
        <div class="form-floating-custom">
            <input type="text" id="sku" placeholder="SKU Code" formControlName="sku">
            <label for="sku">SKU (Unique Code)</label>
        </div>
      </div>

      <!-- Category -->
      <div class="form-floating-custom relative">
        <div class="flex items-center">
            <select id="category" formControlName="category">
                <option value="">Select Category</option>
                <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
            </select>
            <label for="category">Category</label>
            <button type="button" (click)="toggleAddCategory()" class="ml-2 text-primary hover:text-primary-dark font-medium text-sm whitespace-nowrap px-3 py-1 rounded-full hover:bg-primary/10 transition-colors">
                <i class="bi bi-plus-lg"></i> {{ showAddCategory ? 'Cancel' : 'New' }}
            </button>
        </div>
      </div>

      <!-- Add Category Inline Form -->
      <div *ngIf="showAddCategory" class="bg-primary/5 p-6 rounded-2xl border border-primary/20 animate-slide-in">
          <h6 class="text-primary font-bold mb-4 flex items-center gap-2">
              <i class="bi bi-folder-plus"></i> Create New Category
          </h6>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <input type="text" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20" 
                     placeholder="Category Name" [(ngModel)]="newCategory.name" [ngModelOptions]="{standalone: true}">
              <input type="text" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20" 
                     placeholder="Description" [(ngModel)]="newCategory.description" [ngModelOptions]="{standalone: true}">
          </div>
          <button class="w-full mt-4 btn-primary" (click)="createNewCategory()" [disabled]="!newCategory.name || creatingCategory">
              {{ creatingCategory ? 'Saving...' : 'Save Category' }}
          </button>
      </div>

      <!-- Description -->
      <div class="form-floating-custom">
        <textarea id="description" rows="3" placeholder="Description" formControlName="description" class="h-auto min-h-[100px]"></textarea>
        <label for="description">Description</label>
      </div>

      <!-- Price & Stock -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="form-floating-custom">
            <input type="number" id="price" placeholder="Price" formControlName="price">
            <label for="price">Price ($)</label>
        </div>
        <div class="form-floating-custom">
            <input type="number" id="stock" placeholder="Initial Stock" formControlName="stock">
            <label for="stock">Initial Stock</label>
        </div>
      </div>

      <!-- Image URL -->
      <div class="form-floating-custom">
        <input type="text" id="imageUrl" placeholder="Image URL" formControlName="imageUrl">
        <label for="imageUrl">Image URL</label>
      </div>

      <!-- Submit Button -->
      <div class="pt-4">
        <button type="submit" class="w-full py-4 text-lg font-bold btn-primary shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all" 
                [disabled]="productForm.invalid || loading">
          <span *ngIf="!loading"><i class="bi bi-magic me-2"></i> Create Product</span>
          <span *ngIf="loading" class="flex items-center justify-center gap-2">
              <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Creating...
          </span>
        </button>
      </div>

    </form>
  </div>
</div>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">Add New Product</h3>
        </div>
        <div class="card-body">
          
          <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
          <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

          <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
            
            <div class="mb-3">
              <label for="name" class="form-label">Product Name</label>
              <input type="text" id="name" class="form-control" formControlName="name">
              <div *ngIf="productForm.get('name')?.touched && productForm.get('name')?.invalid" class="text-danger small">
                Name is required.
              </div>
            </div>

            <div class="mb-3">
              <label for="sku" class="form-label">SKU (Unique Code)</label>
              <input type="text" id="sku" class="form-control" formControlName="sku">
              <div *ngIf="productForm.get('sku')?.touched && productForm.get('sku')?.invalid" class="text-danger small">
                SKU is required.
              </div>
            </div>

            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <div class="input-group">
                <select id="category" class="form-select" formControlName="category">
                    <option value="">Select Category</option>
                    <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
                </select>
                <button class="btn btn-outline-secondary" type="button" (click)="toggleAddCategory()">
                    <i class="bi bi-plus-lg"></i> {{ showAddCategory ? 'Cancel' : 'New' }}
                </button>
              </div>
              
              <!-- Add Category Section -->
              <div *ngIf="showAddCategory" class="card card-body mt-2 bg-light border-0">
                  <h6 class="card-subtitle mb-2 text-muted">New Category</h6>
                  <div class="mb-2">
                      <input type="text" class="form-control form-control-sm" placeholder="Category Name" [(ngModel)]="newCategory.name" [ngModelOptions]="{standalone: true}">
                  </div>
                  <div class="mb-2">
                      <input type="text" class="form-control form-control-sm" placeholder="Description" [(ngModel)]="newCategory.description" [ngModelOptions]="{standalone: true}">
                  </div>
                  <button class="btn btn-primary btn-sm w-100" (click)="createNewCategory()" [disabled]="!newCategory.name || creatingCategory">
                      {{ creatingCategory ? 'Saving...' : 'Save Category' }}
                  </button>
              </div>

              <div *ngIf="categories.length === 0 && !showAddCategory" class="form-text text-warning">
                  No categories found. Click 'New' to add one.
              </div>
              <div *ngIf="productForm.get('category')?.touched && productForm.get('category')?.invalid" class="text-danger small">
                Category is required.
              </div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea id="description" class="form-control" rows="3" formControlName="description"></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="price" class="form-label">Price</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input type="number" id="price" class="form-control" formControlName="price">
                </div>
                <div *ngIf="productForm.get('price')?.touched && productForm.get('price')?.hasError('min')" class="text-danger small">
                    Price must be greater than 0.
                </div>
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="stock" class="form-label">Initial Stock</label>
                <input type="number" id="stock" class="form-control" formControlName="stock">
                 <div *ngIf="productForm.get('stock')?.touched && productForm.get('stock')?.hasError('min')" class="text-danger small">
                    Stock cannot be negative.
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label for="imageUrl" class="form-label">Image URL</label>
              <input type="text" id="imageUrl" class="form-control" formControlName="imageUrl" placeholder="https://example.com/image.jpg">
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success" [disabled]="productForm.invalid || loading">
                {{ loading ? 'Creating...' : 'Create Product' }}
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

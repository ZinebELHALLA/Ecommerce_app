<div class="min-h-screen bg-gray-50 py-12">
  <div class="max-w-6xl mx-auto px-4">
    
    <!-- Back Button -->
    <button (click)="goBack()" class="mb-6 flex items-center gap-2 text-gray-600 hover:text-primary transition-colors">
      <i class="bi bi-arrow-left text-xl"></i>
      <span class="font-medium">Back to Products</span>
    </button>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-16 w-16 border-4 border-primary border-t-transparent"></div>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="card-premium p-8 text-center">
      <i class="bi bi-exclamation-circle text-6xl text-red-400 mb-4"></i>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Oops!</h2>
      <p class="text-gray-600">{{ error }}</p>
    </div>

    <!-- Product Details -->
    <div *ngIf="product && !loading" class="card-premium overflow-hidden">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-8">
        
        <!-- Image Section -->
        <div class="relative">
          <div class="aspect-square rounded-2xl overflow-hidden bg-gray-100">
            <img [src]="product.imageUrl || 'https://placehold.co/600x600?text=Product+Image'" 
                 [alt]="product.name"
                 class="w-full h-full object-cover">
          </div>
          
          <!-- Stock Badge -->
          <div class="absolute top-4 right-4">
            <span class="px-4 py-2 rounded-full text-sm font-bold shadow-lg backdrop-blur-md"
                  [ngClass]="{
                    'bg-green-500/90 text-white': isInStock,
                    'bg-red-500/90 text-white': !isInStock
                  }">
              {{ isInStock ? '✓ In Stock' : 'Out of Stock' }}
            </span>
          </div>
        </div>

        <!-- Info Section -->
        <div class="flex flex-col">
          <!-- Category -->
          <div class="text-sm font-bold text-secondary uppercase tracking-wider mb-2">
            {{ product.categoryId || 'Uncategorized' }}
          </div>

          <!-- Product Name -->
          <h1 class="text-4xl font-bold text-gray-900 mb-4">{{ product.name }}</h1>

          <!-- Price -->
          <div class="text-5xl font-bold text-primary mb-6">
            {{ product.price | currency }}
          </div>

          <!-- Stock Info -->
          <div class="flex items-center gap-2 mb-6 text-gray-600">
            <i class="bi bi-box-seam"></i>
            <span class="font-medium">{{ stockDisplay }}</span>
          </div>

          <!-- Description -->
          <div class="mb-8">
            <h3 class="text-xl font-bold text-gray-800 mb-3">Description</h3>
            <p class="text-gray-600 leading-relaxed">{{ product.description }}</p>
          </div>

          <!-- SKU -->
          <div class="text-sm text-gray-500 mb-6">
            <span class="font-medium">SKU:</span> {{ product.sku }}
          </div>

          <!-- Add to Cart Button -->
          <button (click)="addToCart()" 
                  [disabled]="!isInStock || addingToCart"
                  class="w-full py-4 px-6 rounded-2xl font-bold text-white text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-3"
                  [ngClass]="{
                    'bg-gradient-to-r from-primary to-secondary cursor-pointer': isInStock && !addingToCart,
                    'bg-gray-300 cursor-not-allowed': !isInStock || addingToCart
                  }">
            <ng-container *ngIf="!addingToCart">
              <i class="bi bi-cart-plus text-2xl"></i>
              <span>Add to Cart</span>
            </ng-container>
            <ng-container *ngIf="addingToCart">
              <div class="w-6 h-6 border-3 border-white border-t-transparent rounded-full animate-spin"></div>
              <span>Adding...</span>
            </ng-container>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="max-w-md w-full">
    <!-- Register Card -->
    <div class="card-premium p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="bi bi-person-plus text-4xl text-white"></i>
        </div>
        <h2 class="text-3xl font-bold text-gray-800">Create Account</h2>
        <p class="text-gray-500 mt-2">Join us and start shopping!</p>
      </div>

      <!-- Register Form -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <!-- Username Field -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="bi bi-person mr-2"></i>Username
          </label>
          <input
            type="text"
            formControlName="username"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
            placeholder="Choose a username"
            [class.border-red-500]="f['username'].invalid && f['username'].touched"
          />
          <p class="text-red-500 text-sm mt-1" *ngIf="f['username'].invalid && f['username'].touched">
            Username must be at least 3 characters
          </p>
        </div>

        <!-- Email Field -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="bi bi-envelope mr-2"></i>Email
          </label>
          <input
            type="email"
            formControlName="email"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
            placeholder="your@email.com"
            [class.border-red-500]="f['email'].invalid && f['email'].touched"
          />
          <p class="text-red-500 text-sm mt-1" *ngIf="f['email'].invalid && f['email'].touched">
            Please enter a valid email
          </p>
        </div>

        <!-- Password Field -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="bi bi-lock mr-2"></i>Password
          </label>
          <input
            type="password"
            formControlName="password"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
            placeholder="Choose a strong password"
            [class.border-red-500]="f['password'].invalid && f['password'].touched"
          />
          <p class="text-red-500 text-sm mt-1" *ngIf="f['password'].invalid && f['password'].touched">
            Password must be at least 6 characters
          </p>
        </div>

        <!-- Confirm Password Field -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="bi bi-lock-fill mr-2"></i>Confirm Password
          </label>
          <input
            type="password"
            formControlName="confirmPassword"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
            placeholder="Confirm your password"
            [class.border-red-500]="registerForm.errors?.['mismatch'] && f['confirmPassword'].touched"
          />
          <p class="text-red-500 text-sm mt-1" *ngIf="registerForm.errors?.['mismatch'] && f['confirmPassword'].touched">
            Passwords do not match
          </p>
        </div>

        <!-- Role Selection -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            <i class="bi bi-shield-check mr-2"></i>Role (Demo Only)
          </label>
          <select
            formControlName="role"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
          >
            <option value="USER">Normal User</option>
            <option value="MANAGER">Manager</option>
          </select>
          <p class="text-gray-400 text-xs mt-1">
            In production, roles are assigned by administrators
          </p>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full py-4 btn-primary text-lg font-bold shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all mb-4"
          [disabled]="loading || registerForm.invalid"
        >
          <span *ngIf="!loading">
            <i class="bi bi-person-plus-fill mr-2"></i>Create Account
          </span>
          <span *ngIf="loading">
            <i class="bi bi-hourglass-split mr-2 animate-spin"></i>Creating Account...
          </span>
        </button>

        <!-- Login Link -->
        <div class="text-center">
          <p class="text-gray-600">
            Already have an account?
            <a routerLink="/login" class="text-primary font-semibold hover:underline ml-1">
              Sign in here
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>

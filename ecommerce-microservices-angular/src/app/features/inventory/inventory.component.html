<div class="container mx-auto px-6 py-8">
  <div class="flex justify-between items-center mb-8">
    <h2 class="page-title">Inventory Management</h2>
    <div class="flex gap-3">
      <button class="btn-primary flex items-center gap-2" (click)="toggleAddStockForm()">
        <i class="bi bi-plus-circle"></i> Add Stock
      </button>
      <button class="btn-secondary flex items-center gap-2" (click)="loadInventory()">
        <i class="bi bi-arrow-clockwise" [class.animate-spin]="loading"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Add Stock Form -->
  <div *ngIf="showAddStockForm" class="card-premium p-6 mb-8 animate-slide-down">
    <h5 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
      <i class="bi bi-box-seam"></i> Add Stock to Product
    </h5>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
      <div class="form-floating-custom">
        <input id="skuCode" type="text" [(ngModel)]="addStockForm.skuCode" placeholder="SKU Code" required>
        <label for="skuCode">SKU Code</label>
      </div>
      
      <div class="form-floating-custom">
        <input id="quantity" type="number" min="1" [(ngModel)]="addStockForm.quantity" placeholder="Quantity" required>
        <label for="quantity">Quantity to Add</label>
      </div>
      
      <div class="flex items-end">
        <button class="btn-primary w-full" (click)="addStock()" [disabled]="!addStockForm.skuCode || !addStockForm.quantity">
          <i class="bi bi-plus-lg mr-2"></i> Add Stock
        </button>
      </div>
    </div>
    
    <div class="flex justify-end">
      <button class="text-gray-500 hover:text-gray-700 text-sm" (click)="toggleAddStockForm()">
        Cancel
      </button>
    </div>
    
    <!-- Add Stock Messages -->
    <div *ngIf="addStockMessage" class="mt-4 bg-green-50 text-green-700 p-3 rounded-xl border border-green-200 flex items-center gap-2">
      <i class="bi bi-check-circle-fill"></i> {{ addStockMessage }}
    </div>
    
    <div *ngIf="addStockError" class="mt-4 bg-red-50 text-red-700 p-3 rounded-xl border border-red-200 flex items-center gap-2">
      <i class="bi bi-exclamation-triangle-fill"></i> {{ addStockError }}
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="flex justify-center py-20">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent"></div>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 mb-6 flex items-center gap-2">
    <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
  </div>

  <!-- Inventory Table -->
  <div *ngIf="!loading && !error" class="card-premium p-1">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-gray-50/50">
          <tr class="text-gray-500 text-sm uppercase tracking-wider">
            <th class="p-5 font-semibold rounded-tl-3xl">Product</th>
            <th class="p-5 font-semibold">SKU</th>
            <th class="p-5 font-semibold">Price</th>
            <th class="p-5 font-semibold">Stock Level</th>
            <th class="p-5 font-semibold rounded-tr-3xl">Status</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
          <tr *ngFor="let item of inventoryItems" class="group hover:bg-pink-50/30 transition-colors">
            <td class="p-5">
              <div class="font-bold text-gray-800 text-lg">{{ item.name }}</div>
              <div class="text-sm text-gray-400 line-clamp-1">{{ item.description }}</div>
            </td>
            <td class="p-5">
                <span class="font-mono text-xs bg-gray-100 px-2 py-1 rounded-md text-gray-600 select-all">{{ item.skuCode }}</span>
            </td>
            <td class="p-5 font-medium text-gray-600">{{ item.price | currency }}</td>
            <td class="p-5">
              <div class="flex items-center gap-2">
                  <span class="text-xl font-bold" [ngClass]="{
                      'text-secondary': item.quantity > 10,
                      'text-accent': item.quantity <= 10 && item.quantity > 0,
                      'text-red-400': item.quantity === 0
                  }">{{ item.quantity }}</span> 
                  <span class="text-xs text-gray-400 uppercase font-bold">units</span>
              </div>
            </td>
            <td class="p-5">
              <span class="px-3 py-1 rounded-full text-xs font-bold shadow-sm inline-flex items-center gap-1" 
                [ngClass]="{
                  'bg-secondary/10 text-secondary border border-secondary/20': item.status === 'In Stock',
                  'bg-accent/10 text-yellow-600 border border-accent/20': item.status === 'Low Stock',
                  'bg-red-50 text-red-500 border border-red-100': item.status === 'Out of Stock',
                  'bg-gray-100 text-gray-500': item.status === 'Unknown'
                }">
                <i class="bi bi-circle-fill text-[6px]"></i> {{ item.status }}
              </span>
            </td>
          </tr>
          
          <tr *ngIf="inventoryItems.length === 0">
            <td colspan="5" class="text-center py-12 text-gray-400">
               <i class="bi bi-box-seam text-4xl mb-2 block opacity-30"></i>
               No products found in inventory.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

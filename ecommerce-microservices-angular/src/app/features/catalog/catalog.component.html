<div class="flex flex-col lg:flex-row gap-8">
  <!-- Sidebar Filters -->
  <aside class="w-full lg:w-1/4 h-fit sticky top-24">
    <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
      <h5 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">
          <i class="bi bi-funnel"></i> Filters
      </h5>
      
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-500 mb-2">Search</label>
        <div class="relative">
            <i class="bi bi-search absolute left-3 top-3 text-gray-400"></i>
            <input type="text" 
                   class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" 
                   placeholder="Keyword..." 
                   [(ngModel)]="searchTerm" 
                   (input)="filterProducts()">
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-500 mb-2">Category</label>
        <select class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all appearance-none" 
                [(ngModel)]="selectedCategory" 
                (change)="filterProducts()">
          <option value="">All Categories</option>
          <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
        </select>
      </div>

      <div class="mb-2">
          <label class="block text-sm font-medium text-gray-500 mb-2">
              Max Price: <span class="text-primary font-bold">{{ priceRange ? (priceRange | currency) : 'Any' }}</span>
          </label>
          <input type="range" 
                 class="w-full accent-primary h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" 
                 min="0" max="1000" step="10" 
                 [(ngModel)]="priceRange" 
                 (input)="filterProducts()">
      </div>
    </div>
  </aside>

  <!-- Product Grid -->
  <div class="flex-1">
    
    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent"></div>
    </div>
    
    <!-- Error State -->
    <div *ngIf="error" class="bg-red-50 text-red-600 p-4 rounded-xl border border-red-100 mb-6 flex items-center gap-3">
        <i class="bi bi-exclamation-circle-fill text-xl"></i> {{ error }}
    </div>

    <!-- Grid -->
    <div *ngIf="!loading && !error" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
      <div *ngFor="let product of filteredProducts" class="group">
        <div class="card-premium h-full flex flex-col relative w-full transform hover:scale-[1.02] transition-transform duration-300">
          <!-- Image -->
          <div class="relative overflow-hidden h-48 bg-gray-100">
              <img [src]="product.imageUrl || 'https://placehold.co/400x300?text=No+Image'" 
                   class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" 
                   alt="{{ product.name }}">
              
              <!-- Stock Badge -->
              <div class="absolute top-3 right-3">
                  <span class="px-3 py-1 rounded-full text-xs font-bold shadow-sm backdrop-blur-md transition-all"
                        [ngClass]="{
                            'bg-secondary/90 text-white': product.inStock, 
                            'bg-gray-500/90 text-white': product.checkingStock, 
                            'bg-red-400/90 text-white': !product.inStock && !product.checkingStock
                        }">
                      <ng-container *ngIf="product.checkingStock">Checking...</ng-container>
                      <ng-container *ngIf="!product.checkingStock && product.inStock">
                        In Stock<span *ngIf="product.availableQuantity != null && product.availableQuantity > 0"> ({{ product.availableQuantity }})</span>
                      </ng-container>
                      <ng-container *ngIf="!product.checkingStock && !product.inStock">Out of Stock</ng-container>
                  </span>
              </div>
          </div>
          
          <!-- Content -->
          <div class="p-5 flex flex-col flex-grow">
            <!-- Category -->
            <div class="text-xs text-secondary font-bold uppercase tracking-wider mb-1">{{ getCategoryName(product.categoryId) }}</div>
            <h5 class="text-lg font-bold text-gray-800 mb-2 truncate" title="{{ product.name }}">{{ product.name }}</h5>
            
            <p class="text-gray-500 text-sm mb-4 line-clamp-2">{{ product.description }}</p>
            
            <div class="mt-auto pt-4 border-t border-gray-50">
              <div class="flex justify-between items-center mb-3">
                <span class="text-xl font-bold text-primary">{{ product.price | currency }}</span>
              </div>
              
              <!-- Add to Cart Section -->
              <div class="flex items-center gap-2">
                <div class="flex items-center bg-gray-50 rounded-full border border-gray-100 flex-1">
                  <button class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-primary transition-colors disabled:opacity-30" 
                          [disabled]="!product.inStock || product.checkingStock">
                      <i class="bi bi-dash"></i>
                  </button>
                  <span class="flex-1 text-center font-bold text-gray-700 text-sm">1</span>
                  <button class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-primary transition-colors disabled:opacity-30"
                          [disabled]="!product.inStock || product.checkingStock">
                      <i class="bi bi-plus"></i>
                  </button>
                </div>
                
                <button class="px-4 py-2 bg-primary text-white rounded-full hover:bg-primary-dark transition-all duration-300 flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed font-bold text-sm" 
                        (click)="addToCart(product, 1)" 
                        [disabled]="!product.inStock || product.checkingStock">
                  <i class="bi bi-cart-plus"></i>
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Empty State -->
    <div *ngIf="!loading && filteredProducts.length === 0" class="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-200">
        <i class="bi bi-basket text-6xl text-gray-300 mb-4 block"></i>
        <p class="text-gray-500 text-lg">No products found matching your criteria.</p>
        <button (click)="searchTerm = ''; selectedCategory = ''; priceRange = null; filterProducts()" class="text-primary hover:underline font-medium mt-2">Clear Filters</button>
    </div>
  </div>
</div>
